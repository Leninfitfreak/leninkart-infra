apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-creds
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KAFKA_BOOTSTRAP_SERVERS: 172.18.0.1:9092
  dataFrom:
  - extract:
      key: leninkart/kafka/credentials
