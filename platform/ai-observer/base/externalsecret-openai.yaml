apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-observer-secrets
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ai-observer-secrets
    creationPolicy: Owner
  data:
    - secretKey: OLLAMA_API_KEY
      remoteRef:
        key: leninkart/ai-observer/config
        property: OLLAMA_API_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: leninkart/ai-observer/config
        property: DATABASE_URL
