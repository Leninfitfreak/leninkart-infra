apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-observer-script
data:
  observer.py: |
    import json
    import os
    import time
    from datetime import datetime, timezone
    from urllib.parse import urlencode
    from urllib.request import urlopen, Request

    PROM_URL = os.getenv("PROM_URL", "http://prometheus:9090")
    LOKI_URL = os.getenv("LOKI_URL", "http://loki:3100")
    JAEGER_URL = os.getenv("JAEGER_URL", "http://jaeger-query:16686")
    MONITORED_JOBS = [j.strip() for j in os.getenv("MONITORED_JOBS", "product-service,order-service,otel").split(",") if j.strip()]
    LOG_QUERY = os.getenv("LOKI_ERROR_QUERY", '{namespace="dev"} |= "ERROR"')
    OUTPUT_MODE = os.getenv("OUTPUT_MODE", "both").lower()  # json | text | both
    RECOMMENDATION_COOLDOWN_SECONDS = int(os.getenv("RECOMMENDATION_COOLDOWN_SECONDS", "600"))

    RULES_PATH = "/config/rules.json"

    def now_iso():
      return datetime.now(timezone.utc).isoformat()

    def http_get_json(url):
      req = Request(url, headers={"Accept": "application/json"})
      with urlopen(req, timeout=8) as resp:
        return json.loads(resp.read().decode("utf-8"))

    def prom_query(query):
      qs = urlencode({"query": query})
      data = http_get_json(f"{PROM_URL}/api/v1/query?{qs}")
      return data.get("data", {}).get("result", [])

    def prom_scalar(query):
      result = prom_query(query)
      if not result:
        return None
      return float(result[0]["value"][1])

    def loki_error_count(query, minutes):
      end_ns = int(time.time() * 1e9)
      start_ns = int((time.time() - (minutes * 60)) * 1e9)
      params = {
        "query": query,
        "start": str(start_ns),
        "end": str(end_ns),
        "limit": "500"
      }
      data = http_get_json(f"{LOKI_URL}/loki/api/v1/query_range?{urlencode(params)}")
      streams = data.get("data", {}).get("result", [])
      return sum(len(s.get("values", [])) for s in streams)

    def jaeger_reachable():
      data = http_get_json(f"{JAEGER_URL}/api/services")
      return isinstance(data.get("data", []), list)

    def load_rules():
      with open(RULES_PATH, "r", encoding="utf-8") as f:
        return json.load(f)

    def build_human_summary(findings, up_states, err_ratio, p95, log_errors):
      if not findings:
        jobs_ok = ", ".join([k for k, v in up_states.items() if v is not None and v >= 1])
        return f"System looks healthy. All monitored targets are up ({jobs_ok}). Error ratio and latency are within thresholds."

      parts = []
      downs = [f.get("job") for f in findings if f.get("kind") == "availability" and f.get("level") == "critical"]
      missing = [f.get("job") for f in findings if f.get("kind") == "availability" and "missing up series" in f.get("msg", "")]
      if downs:
        parts.append(f"Service availability issue detected: {', '.join(downs)} appears down.")
      if missing:
        parts.append(f"Metrics are missing for: {', '.join(missing)}.")
      if err_ratio is not None:
        parts.append(f"Current 5xx error ratio (5m) is {err_ratio:.3f}.")
      if p95 is not None:
        parts.append(f"Current p95 latency (5m) is {p95:.3f}s.")
      if log_errors is not None and log_errors > 0:
        parts.append(f"Found {log_errors} error log lines in the recent log window.")
      if any(f.get("kind") == "tracing" for f in findings):
        parts.append("Tracing backend check reported an issue.")
      return " ".join(parts)

    def build_recommendations(findings):
      recs = []
      seen = set()
      for finding in findings:
        kind = finding.get("kind")
        if kind == "availability":
          job = finding.get("job", "unknown-service")
          key = f"availability:{job}"
          if key not in seen:
            recs.append(
              f"Verify {job} pods and readiness probes; then check Service/Endpoint wiring. "
              f"Commands: kubectl -n dev get pods,svc,endpoints | findstr /I \"{job}\""
            )
            seen.add(key)
        elif kind == "error_rate" and "error_rate" not in seen:
          recs.append(
            "Investigate failing API paths and recent 5xx logs. "
            "Start with app logs and Grafana Loki filter for severity=error in the last 15m."
          )
          seen.add("error_rate")
        elif kind == "latency" and "latency" not in seen:
          recs.append(
            "Latency is elevated. Check DB/Kafka dependency latency and pod resource saturation "
            "(CPU throttling/memory pressure). Consider HPA or request/limit tuning."
          )
          seen.add("latency")
        elif kind == "logs" and "logs" not in seen:
          recs.append(
            "Correlate repeated error log signatures with trace spans to identify the failing code path quickly."
          )
          seen.add("logs")
        elif kind == "tracing" and "tracing" not in seen:
          recs.append(
            "Validate Jaeger and OTEL collector connectivity and service discovery in namespace dev."
          )
          seen.add("tracing")
      if not recs:
        recs.append("No action needed. Continue monitoring.")
      return recs

    def evaluate(rules):
      findings = []
      severity = "info"

      up_states = {}
      for job in MONITORED_JOBS:
        res = prom_query(f'up{{job="{job}"}}')
        val = None if not res else float(res[0]["value"][1])
        up_states[job] = val
        if val is None:
          findings.append({"level": "warning", "kind": "availability", "job": job, "msg": "missing up series"})
          severity = "warning" if severity == "info" else severity
        elif val < 1:
          findings.append({"level": "critical", "kind": "availability", "job": job, "msg": "target down"})
          severity = "critical"

      err_ratio = prom_scalar(
        'sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))'
      )
      if err_ratio is not None and err_ratio > float(rules["error_rate_threshold"]):
        findings.append({
          "level": "warning",
          "kind": "error_rate",
          "value": err_ratio,
          "threshold": rules["error_rate_threshold"],
          "msg": "5xx ratio above threshold"
        })
        severity = "warning" if severity == "info" else severity

      p95 = prom_scalar(
        'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le))'
      )
      if p95 is not None and p95 > float(rules["latency_p95_threshold_seconds"]):
        findings.append({
          "level": "warning",
          "kind": "latency",
          "value_seconds": p95,
          "threshold_seconds": rules["latency_p95_threshold_seconds"],
          "msg": "p95 latency above threshold"
        })
        severity = "warning" if severity == "info" else severity

      log_errors = None
      try:
        log_errors = loki_error_count(LOG_QUERY, int(rules["log_window_minutes"]))
        if log_errors > 0:
          findings.append({
            "level": "info",
            "kind": "logs",
            "count": log_errors,
            "window_minutes": rules["log_window_minutes"],
            "msg": "error logs detected"
          })
      except Exception as e:
        findings.append({"level": "warning", "kind": "logs", "msg": f"loki query failed: {e}"})
        severity = "warning" if severity == "info" else severity

      jaeger_ok = False
      try:
        jaeger_ok = jaeger_reachable()
      except Exception as e:
        findings.append({"level": "warning", "kind": "tracing", "msg": f"jaeger query failed: {e}"})
        severity = "warning" if severity == "info" else severity

      if not jaeger_ok:
        findings.append({"level": "warning", "kind": "tracing", "msg": "jaeger API unreachable"})
        severity = "warning" if severity == "info" else severity

      recommendations = build_recommendations(findings)
      human_summary = build_human_summary(findings, up_states, err_ratio, p95, log_errors)

      return {
        "ts": now_iso(),
        "severity": severity,
        "human_summary": human_summary,
        "jobs": up_states,
        "error_ratio_5m": err_ratio,
        "latency_p95_s_5m": p95,
        "findings": findings,
        "log_errors_5m": log_errors,
        "recommendations": recommendations
      }

    def main():
      rules = load_rules()
      interval = int(rules.get("interval_seconds", 60))
      last_emitted = {}
      while True:
        try:
          report = evaluate(rules)
          now_ts = time.time()
          filtered_recs = []
          for rec in report.get("recommendations", []):
            last_ts = last_emitted.get(rec, 0)
            if (now_ts - last_ts) >= RECOMMENDATION_COOLDOWN_SECONDS:
              filtered_recs.append(rec)
              last_emitted[rec] = now_ts
          report["recommendations"] = filtered_recs
          # Keep dedup map bounded for long-running processes.
          if len(last_emitted) > 200:
            cutoff = now_ts - (RECOMMENDATION_COOLDOWN_SECONDS * 2)
            last_emitted = {k: v for k, v in last_emitted.items() if v >= cutoff}

          if OUTPUT_MODE in ("text", "both"):
            print(f"[AI-OBSERVER] severity={report['severity']} summary={report['human_summary']}")
            for r in report.get("recommendations", []):
              print(f"[AI-OBSERVER][recommendation] {r}")
          if OUTPUT_MODE in ("json", "both"):
            print(json.dumps(report, separators=(",", ":")))
        except Exception as e:
          print(json.dumps({"ts": now_iso(), "severity": "error", "msg": "observer failure", "error": str(e)}))
        time.sleep(interval)

    if __name__ == "__main__":
      main()
