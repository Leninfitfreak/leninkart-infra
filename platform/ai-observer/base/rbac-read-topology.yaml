apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-observer-read-topology
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-observer-read-topology
subjects:
  - kind: ServiceAccount
    name: ai-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-observer-read-topology
