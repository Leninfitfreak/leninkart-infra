apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-observer
  labels:
    app: ai-observer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-observer
  template:
    metadata:
      labels:
        app: ai-observer
      annotations:
        ai-observer/config-version: "v4-fastapi-webhook-agent"
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ai-observer
      hostAliases:
        - ip: "192.168.49.1"
          hostnames:
            - "host.minikube.internal"
      containers:
        - name: ai-observer
          image: docker.io/leninfitfreak/ai-observer-agent:sha-a5bfefd
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ai-observer-env
            - secretRef:
                name: ai-observer-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
