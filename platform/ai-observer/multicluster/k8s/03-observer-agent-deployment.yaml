apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer-agent
  namespace: dev
  labels:
    app: observer-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer-agent
  template:
    metadata:
      labels:
        app: observer-agent
    spec:
      containers:
        - name: observer-agent
          image: observer-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: observer-agent-config
            - secretRef:
                name: observer-agent-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
