apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-observer-central-otel
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-observer-central-otel
  template:
    metadata:
      labels:
        app: ai-observer-central-otel
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.105.0
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: ai-observer-central-otel-config
            items:
              - key: collector-config.yaml
                path: config.yaml