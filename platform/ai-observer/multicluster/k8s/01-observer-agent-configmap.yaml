apiVersion: v1
kind: ConfigMap
metadata:
  name: observer-agent-config
  namespace: dev
data:
  CLUSTER_ID: "minikube-dev"
  CENTRAL_PUSH_URL: "http://ai-observer-central-collector.dev.svc.cluster.local:8081/api/agent/push"
  LOCAL_PROMETHEUS_URL: "http://prometheus.dev.svc.cluster.local:9090"
  LOCAL_OTEL_METRICS_URL: "http://otel-collector.dev.svc.cluster.local:8889/metrics"
  POLL_INTERVAL_SECONDS: "30"
  HTTP_TIMEOUT_SECONDS: "6"
  PROM_QUERIES: "up_count=sum(up);http_5xx_rate=sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))"