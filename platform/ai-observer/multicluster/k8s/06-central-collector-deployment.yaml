apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-observer-central-collector
  namespace: dev
  labels:
    app: ai-observer-central-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-observer-central-collector
  template:
    metadata:
      labels:
        app: ai-observer-central-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: collector
          image: ai-observer-central-collector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: ai-observer-central-collector-env
            - secretRef:
                name: ai-observer-central-collector-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi