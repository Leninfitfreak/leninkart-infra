apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-observer-central-otel-config
  namespace: dev
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      prometheusremotewrite:
        endpoint: http://mimir.dev.svc.cluster.local:9009/api/v1/push
      loki:
        endpoint: http://loki.dev.svc.cluster.local:3100/loki/api/v1/push
      otlphttp/tempo:
        endpoint: http://tempo.dev.svc.cluster.local:4318/v1/traces

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [loki]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]