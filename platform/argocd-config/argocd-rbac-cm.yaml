apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    p, role:github-actions, applications, get, */*, allow
    p, role:github-actions, applications, sync, */*, allow
    g, github-actions, role:github-actions
