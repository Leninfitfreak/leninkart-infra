apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator-script
  namespace: dev
data:
  run.sh: |
    #!/bin/sh
    set -eu
    FRONTEND_BASE="${FRONTEND_BASE:-http://leninkart-frontend.dev.svc.cluster.local}"
    PRODUCT_BASE="${PRODUCT_BASE:-http://leninkart-product-service.dev.svc.cluster.local:8081}"
    ORDER_BASE="${ORDER_BASE:-http://leninkart-order-service.dev.svc.cluster.local:8080}"
    USER_EMAIL_BASE="${USER_EMAIL_BASE:-telemetry-load}"
    USER_EMAIL_DOMAIN="${USER_EMAIL_DOMAIN:-leninkart.local}"
    USER_PASSWORD="${USER_PASSWORD:-leninfitfreak}"
    USER_FULL_NAME="${USER_FULL_NAME:-Load Generator}"
    PARALLEL_REQUESTS="${PARALLEL_REQUESTS:-4}"
    LOOP_SLEEP_SECONDS="${LOOP_SLEEP_SECONDS:-1}"
    REQUEST_TIMEOUT_SECONDS="${REQUEST_TIMEOUT_SECONDS:-6}"
    MAX_AUTH_ATTEMPTS="${MAX_AUTH_ATTEMPTS:-3}"
    HOST_ID="$(hostname 2>/dev/null | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')"
    USER_EMAIL="${USER_EMAIL:-${USER_EMAIL_BASE}-${HOST_ID}@${USER_EMAIL_DOMAIN}}"

    extract_token() {
      sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
    }

    new_email() {
      ts="$(date +%s)"
      echo "${USER_EMAIL_BASE}-${HOST_ID}-${ts}-$$@${USER_EMAIL_DOMAIN}"
    }

    login() {
      email="$1"
      resp="$(curl -sS --max-time "$REQUEST_TIMEOUT_SECONDS" -X POST "$PRODUCT_BASE/auth/login" \
        -H "Content-Type: application/json" \
        -d "{\"email\":\"$email\",\"password\":\"$USER_PASSWORD\"}" || true)"
      echo "$resp" | extract_token
    }

    signup() {
      email="$1"
      resp="$(curl -sS --max-time "$REQUEST_TIMEOUT_SECONDS" -X POST "$PRODUCT_BASE/auth/signup" \
        -H "Content-Type: application/json" \
        -d "{\"fullName\":\"$USER_FULL_NAME\",\"email\":\"$email\",\"password\":\"$USER_PASSWORD\"}" || true)"
      echo "$resp" | extract_token
    }

    TOKEN=""
    CURRENT_EMAIL="$USER_EMAIL"

    while true; do
      curl -sS "$FRONTEND_BASE/" >/dev/null 2>&1 || true

      if [ -z "$TOKEN" ]; then
        attempt=1
        while [ "$attempt" -le "$MAX_AUTH_ATTEMPTS" ] && [ -z "$TOKEN" ]; do
          TOKEN="$(login "$CURRENT_EMAIL")"
          if [ -z "$TOKEN" ]; then
            TOKEN="$(signup "$CURRENT_EMAIL")"
          fi
          if [ -z "$TOKEN" ]; then
            CURRENT_EMAIL="$(new_email)"
          fi
          attempt=$((attempt + 1))
        done
      fi

      if [ -n "$TOKEN" ]; then
        rm -f /tmp/lt-auth-fail
        i=1
        while [ "$i" -le "$PARALLEL_REQUESTS" ]; do
          (
            ts="$(date +%s)-${i}-$$"
            price=$(( (i * 173 + $$) % 5000 + 100 ))
            payload="{\"name\":\"lt-item-$ts\",\"price\":$price,\"description\":\"loadtest generated item $ts\"}"

            code="$(curl -sS --max-time "$REQUEST_TIMEOUT_SECONDS" -o /tmp/lt-post-$i.out -w "%{http_code}" \
              -X POST "$PRODUCT_BASE/api/products" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" || true)"

            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              touch /tmp/lt-auth-fail
            fi

            created_id="$(sed -n 's/.*"id"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' /tmp/lt-post-$i.out | head -n1)"
            if [ -n "$created_id" ]; then
              order_code="$(curl -sS --max-time "$REQUEST_TIMEOUT_SECONDS" -o /tmp/lt-order-$i.out -w "%{http_code}" \
                -X POST "$PRODUCT_BASE/api/products/$created_id/order" \
                -H "Authorization: Bearer $TOKEN" || true)"
              if [ "$order_code" = "401" ] || [ "$order_code" = "403" ]; then
                touch /tmp/lt-auth-fail
              fi
            fi

            curl -sS --max-time "$REQUEST_TIMEOUT_SECONDS" "$PRODUCT_BASE/api/products" -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
            curl -sS --max-time "$REQUEST_TIMEOUT_SECONDS" "$ORDER_BASE/api/orders" -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
          ) &
          i=$((i + 1))
        done
        wait

        if [ -f /tmp/lt-auth-fail ]; then
          TOKEN=""
          CURRENT_EMAIL="$(new_email)"
        fi
      fi

      sleep "$LOOP_SLEEP_SECONDS"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: dev
  labels:
    app: traffic-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
        - name: traffic-generator
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "/scripts/run.sh"]
          env:
            - name: FRONTEND_BASE
              value: "http://leninkart-frontend.dev.svc.cluster.local"
            - name: PRODUCT_BASE
              value: "http://leninkart-product-service.dev.svc.cluster.local:8081"
            - name: ORDER_BASE
              value: "http://leninkart-order-service.dev.svc.cluster.local:8080"
            - name: USER_EMAIL_BASE
              value: "telemetry-load"
            - name: USER_EMAIL_DOMAIN
              value: "leninkart.local"
            - name: USER_PASSWORD
              value: "leninfitfreak"
            - name: USER_FULL_NAME
              value: "Load Generator"
            - name: PARALLEL_REQUESTS
              value: "4"
            - name: LOOP_SLEEP_SECONDS
              value: "1"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: traffic-generator-script
            defaultMode: 0755
