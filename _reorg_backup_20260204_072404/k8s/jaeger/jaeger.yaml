apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.53
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 4317
            - containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: dev
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp
      port: 4317
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: dev
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
