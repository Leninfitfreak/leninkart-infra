spec:
  template:
    spec:
      initContainers:
        - name: copyutil
          command:
            - sh
            - -c
          args:
            - >-
              /bin/rm -f /var/run/argocd/argocd /var/run/argocd/argocd-cmp-server &&
              /bin/cp /usr/local/bin/argocd /var/run/argocd/argocd &&
              /bin/ln -sf /var/run/argocd/argocd /var/run/argocd/argocd-cmp-server
