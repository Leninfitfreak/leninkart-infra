apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: product-service-db-creds
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: product-service-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.dev.svc.cluster.local:5432/leninkart"
        SPRING_DATASOURCE_USERNAME: "{{ .username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: leninkart/product-service/database
---
# Static secret stored in Vault (for reference)
# kubectl exec -n vault vault-0 -- vault kv put secret/leninkart/product-service/database \
#   username=product_user \
#   password=secure_password_here
