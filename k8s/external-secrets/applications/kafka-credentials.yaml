apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-creds
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: kafka-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka.dev.svc.cluster.local:9092"
        # Add SASL credentials when Kafka auth is enabled
        # KAFKA_SASL_USERNAME: "{{ .username }}"
        # KAFKA_SASL_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: leninkart/kafka/credentials
