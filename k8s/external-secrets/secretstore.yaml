apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: dev
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      namespace: root              # 🔥 REQUIRED (Vault Enterprise)
      auth:
        kubernetes:
          mountPath: kubernetes
          role: leninkart-role
          serviceAccountRef:
            name: external-secrets  # 🔥 MUST MATCH VAULT ROLE
            namespace: external-secrets-system