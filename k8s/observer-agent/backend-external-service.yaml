apiVersion: v1
kind: Service
metadata:
  name: observer-backend-external
  namespace: dev
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: observer-backend-external
  namespace: dev
subsets:
  - addresses:
      - ip: 192.168.49.10
    ports:
      - name: http
        port: 8080
        protocol: TCP
