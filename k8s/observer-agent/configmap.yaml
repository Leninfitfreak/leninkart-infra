apiVersion: v1
kind: ConfigMap
metadata:
  name: observer-agent-config
data:
  CLUSTER_ID: "minikube-dev"
  CENTRAL_URL: "http://observer-backend-external:8080/api/agent/push"
  PROM_URL: "http://prometheus:9090"
  PUSH_INTERVAL: "30"
  ENVIRONMENT: "dev"
  K8S_DISCOVERY_ENABLED: "true"
  K8S_DISCOVERY_NAMESPACES: "dev"
  K8S_DISCOVERY_TIMEOUT_SECONDS: "4"
  K8S_API_URL: "https://kubernetes.default.svc"
  K8S_VERIFY_SSL: "true"
