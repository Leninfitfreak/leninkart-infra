apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer-agent
  template:
    metadata:
      labels:
        app: observer-agent
    spec:
      hostAliases:
        - ip: "192.168.49.1"
          hostnames:
            - "observer-core.local"
      containers:
        - name: observer-agent
          image: observer-agent:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: observer-agent-config
            - secretRef:
                name: observer-agent-secret
