apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer-agent
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer-agent
  template:
    metadata:
      labels:
        app: observer-agent
    spec:
      serviceAccountName: observer-agent
      containers:
        - name: observer-agent
          image: docker.io/leninfitfreak/observer-agent:sha-ca9be4c
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: observer-agent-config
            - secretRef:
                name: observer-agent-secret
