replicaCount: 1
image:
  repository: leninfitfreak/order-service
  tag: "22540434225"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
startupProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 10
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi
env:
  JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=70 -XX:+UseContainerSupport"
  # ---------- DATABASE ----------
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.dev.svc.cluster.local:5432/leninkart
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "60000"
  # ---------- KAFKA ----------
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka.dev.svc.cluster.local:9092,kafka-1.kafka.dev.svc.cluster.local:9092
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
  MANAGEMENT_HEALTH_BINDERS_ENABLED: "false"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  APP_JWT_SECRET: "leninkart-dev-secret"
  APP_JWT_ISSUER: "leninkart"
  APP_JWT_TTL_SECONDS: "86400"
  APP_AUTH_USERS: ""
  OTEL_SERVICE_NAME: "order-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.dev.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
# ============================================
# OPENTELEMETRY CONFIGURATION
# ============================================
otel:
  enabled: true
  javaAgent:
    version: "1.32.0"
  serviceName: "order-service"
  endpoint: "http://otel-collector:4318"
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
# ============================================
# VAULT SECRETS INTEGRATION
# ============================================
# Secrets are now managed by HashiCorp Vault via External Secrets Operator
# 
# To enable Vault secrets in deployments, add envFrom to your deployment:
#
# envFrom:
#   - secretRef:
#       name: product-service-db-secret
#   - secretRef:
#       name: product-service-config-secret
#
# This replaces hardcoded environment variables with Vault-managed secrets
secrets:
  vault:
    enabled: true
    secretStore: vault-backend
    refreshInterval: 1h
    dbSecretName: order-service-db-secret
