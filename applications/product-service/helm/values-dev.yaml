replicaCount: 1
image:
  repository: leninfitfreak/product-service
  tag: '21971963805'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8081
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
startupProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 10
env:
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.dev.svc.cluster.local:5432/leninkart
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: 'true'
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka.dev.svc.cluster.local:9092,kafka-1.kafka.dev.svc.cluster.local:9092
  APP_JWT_SECRET: "leninkart-dev-secret"
  APP_JWT_ISSUER: "leninkart"
  APP_JWT_TTL_SECONDS: "86400"
  APP_AUTH_USERS: "leninkart:leninkart123:USER,admin:admin123:ADMIN,leninfitfreak@gmail.com:leninkart123:USER"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  OTEL_SERVICE_NAME: "product-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
# ============================================
# OPENTELEMETRY CONFIGURATION
# ============================================
otel:
  enabled: true
  javaAgent:
    version: "1.32.0"
  serviceName: "product-service"
  endpoint: "http://otel-collector:4318"
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
# ============================================
# VAULT SECRETS INTEGRATION
# ============================================
# Secrets are now managed by HashiCorp Vault via External Secrets Operator
# 
# To enable Vault secrets in deployments, add envFrom to your deployment:
#
# envFrom:
#   - secretRef:
#       name: product-service-db-secret
#   - secretRef:
#       name: product-service-config-secret
#
# This replaces hardcoded environment variables with Vault-managed secrets
secrets:
  vault:
    enabled: true
    secretStore: vault-backend
    refreshInterval: 1h
    dbSecretName: product-service-db-secret
