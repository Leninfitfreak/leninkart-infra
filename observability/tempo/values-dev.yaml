fullnameOverride: tempo

tempo:
  reportingEnabled: false
  retention: 24h
  memBallastSizeMbs: 16
  metricsGenerator:
    enabled: false
  server:
    http_listen_port: 3200
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

service:
  type: ClusterIP

serviceMonitor:
  enabled: false

persistence:
  enabled: true
  size: 5Gi
