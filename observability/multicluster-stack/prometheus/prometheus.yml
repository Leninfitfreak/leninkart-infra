global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: central-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['central-collector:8081']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

remote_write:
  - url: http://mimir:9009/api/v1/push