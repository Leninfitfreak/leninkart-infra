multitenancy_enabled: false

server:
  http_listen_port: 9009

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /tmp/mimir/common

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/blocks
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

compactor:
  data_dir: /tmp/mimir/compactor

ruler:
  rule_path: /tmp/mimir/ruler/rules
  ring:
    kvstore:
      store: inmemory

limits:
  max_label_names_per_series: 40
