alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  fullnameOverride: prometheus-server
  retention: 2d
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP
    servicePort: 80

scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  product-service:
    job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - leninkart-product-service.dev.svc.cluster.local:8081
  order-service:
    job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - leninkart-order-service.dev.svc.cluster.local:8080
  kafka-platform:
    job_name: kafka-platform
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.18.0.1:7071
