alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  fullnameOverride: prometheus-server
  retention: 2d
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP
    servicePort: 80

serverFiles:
  prometheus.yml:
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      evaluation_interval: 30s
    rule_files:
      - /etc/config/alerting_rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
      - job_name: product-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - leninkart-product-service.dev.svc.cluster.local:8081
      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - leninkart-order-service.dev.svc.cluster.local:8080
      - job_name: kafka-platform
        metrics_path: /metrics
        static_configs:
          - targets:
              - 172.18.0.1:7071
  alerting_rules.yml:
    groups:
      - name: leninkart-observability
        rules:
          - alert: ProductServiceDown
            expr: up{job="product-service"} == 0
            for: 2m
            labels:
              severity: critical
              service: product-service
            annotations:
              summary: Product service is down
              description: Product service metrics have been unavailable for more than two minutes.
          - alert: OrderServiceDown
            expr: up{job="order-service"} == 0
            for: 2m
            labels:
              severity: critical
              service: order-service
            annotations:
              summary: Order service is down
              description: Order service metrics have been unavailable for more than two minutes.
          - alert: ProductServiceHighLatency
            expr: (rate(http_server_requests_seconds_sum{job="product-service",uri!~".*actuator.*"}[5m]) / clamp_min(rate(http_server_requests_seconds_count{job="product-service",uri!~".*actuator.*"}[5m]), 0.001)) > 1.5
            for: 5m
            labels:
              severity: warning
              service: product-service
            annotations:
              summary: Product service latency is elevated
              description: Product service average latency has exceeded 1.5 seconds for five minutes.
          - alert: OrderServiceHighErrorRate
            expr: sum(rate(http_server_requests_seconds_count{job="order-service",status=~"5..",uri!~".*actuator.*"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="order-service",uri!~".*actuator.*"}[5m])), 0.001) > 0.05
            for: 5m
            labels:
              severity: warning
              service: order-service
            annotations:
              summary: Order service error rate is elevated
              description: Order service 5xx responses are above 5 percent for five minutes.
