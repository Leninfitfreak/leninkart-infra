apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/ai-observer-rules.yml
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.dev.svc.cluster.local:8889']
            labels:
              namespace: dev
              app: otel-collector
      - job_name: 'product-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['leninkart-product-service.dev.svc.cluster.local:8081']
            labels:
              namespace: dev
              app: product-service
      - job_name: 'order-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['leninkart-order-service.dev.svc.cluster.local:8080']
            labels:
              namespace: dev
              app: order-service
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - dev
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
  ai-observer-rules.yml: |
    groups:
      - name: ai-observer-agent-compat
        rules:
          - record: process_cpu_seconds_total
            expr: process_cpu_time_ns_total / 1e9
          - record: process_resident_memory_bytes
            expr: sum by (job, instance, app, namespace) (jvm_memory_used_bytes)
          - record: http_requests_total
            expr: http_server_requests_seconds_count
      - name: ai-observer-recording
        rules:
          - record: aiobserver:thread_pool_saturation_5m
            expr: |
              sum(max_over_time(jvm_threads_live_threads{namespace="dev"}[5m]))
              /
              clamp_min(sum(max_over_time(jvm_threads_peak_threads{namespace="dev"}[5m])), 1)
          - record: aiobserver:db_connection_pool_usage_5m
            expr: |
              sum(max_over_time(hikaricp_connections_active{namespace="dev"}[5m]))
              /
              clamp_min(sum(max_over_time(hikaricp_connections_max{namespace="dev"}[5m])), 1)
          - record: aiobserver:kafka_consumer_lag
            expr: |
              sum(kafka_consumergroup_lag)
            labels:
              namespace: dev
      - name: ai-observer-alerts
        rules:
          - alert: AIObserverThreadPoolSaturationHigh
            expr: aiobserver:thread_pool_saturation_5m > 0.80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Thread pool saturation is high in dev"
              description: "Thread pool saturation > 80% for 10 minutes."
          - alert: AIObserverDBPoolUsageHigh
            expr: aiobserver:db_connection_pool_usage_5m > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "DB connection pool usage is high in dev"
              description: "DB connection pool usage > 85% for 10 minutes."
          - alert: AIObserverKafkaConsumerLagHigh
            expr: aiobserver:kafka_consumer_lag > 1000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag is high in dev"
              description: "Kafka consumer lag > 1000 for 10 minutes."
