apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: dev
data:
  jvm-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "JVM Live Threads",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(jvm_threads_live_threads)", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 2,
          "title": "Heap Memory Used (MB)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) / 1024 / 1024", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 3,
          "title": "JVM GC Pause Count (5m rate)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "sum(rate(jvm_gc_pause_seconds_count[5m]))", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 4,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "sum(process_cpu_usage)", "refId": "A"}],
          "datasource": "Prometheus"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["leninkart", "jvm"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "LeninKart JVM Overview",
      "version": 1,
      "weekStart": ""
    }

  http-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count[5m]))", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 2,
          "title": "HTTP 95th Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le))",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 3,
          "title": "HTTP Status Codes (5m rate)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[5m])) by (status)",
              "legendFormat": "status {{status}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["leninkart", "http"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "LeninKart HTTP Overview",
      "version": 1,
      "weekStart": ""
    }

  kafka-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Producer Send Rate (records/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(kafka_producer_record_send_total[5m])) by (client_id)",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 2,
          "title": "Consumer Throughput (records/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(kafka_consumer_records_consumed_total[5m])) by (client_id)",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 3,
          "title": "Consumer Lag Max",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "max(kafka_consumer_fetch_manager_records_lag_max) by (client_id)",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 4,
          "title": "Kafka Cluster Up",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(up{job=~\".*kafka.*\"})",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["leninkart", "kafka"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "LeninKart Kafka Overview",
      "version": 1,
      "weekStart": ""
    }
