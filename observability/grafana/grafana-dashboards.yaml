apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: dev
data:
  platform-overview.json: |
    {
      "uid": "leninkart-platform-overview",
      "title": "LeninKart Platform Overview",
      "tags": ["leninkart", "platform"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Targets Up",
          "datasource": "Prometheus",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(up{job=~\"product-service|order-service|otel\"})"}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "HTTP Req/s (5m)",
          "datasource": "Prometheus",
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count[5m]))"}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx Ratio (5m)",
          "datasource": "Prometheus",
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.000001)"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 Latency (s, 5m)",
          "datasource": "Prometheus",
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le))"
            }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Request Rate by Job",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[5m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "HTTP 95th Latency by Job",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "5xx Rate by Job",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "AI Observer Critical/Warning (5m)",
          "type": "timeseries",
          "datasource": "Loki",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"dev\",app=\"ai-observer\"} | json | severity=~\"warning|critical\" [5m]))",
              "refId": "A"
            }
          ]
        }
      ]
    }

  jvm-overview.json: |
    {
      "uid": "leninkart-jvm-overview",
      "title": "LeninKart JVM Overview",
      "tags": ["leninkart", "jvm"],
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "JVM Live Threads",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(jvm_threads_live_threads) by (job)", "legendFormat": "{{job}}", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 2,
          "title": "Heap Memory Used (MB)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (job) / 1024 / 1024", "legendFormat": "{{job}}", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 3,
          "title": "JVM GC Pause Count (5m rate)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "sum(rate(jvm_gc_pause_seconds_count[5m])) by (job)", "legendFormat": "{{job}}", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 4,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "sum(process_cpu_usage) by (job)", "legendFormat": "{{job}}", "refId": "A"}],
          "datasource": "Prometheus"
        }
      ]
    }

  http-overview.json: |
    {
      "uid": "leninkart-http-overview",
      "title": "LeninKart HTTP Overview",
      "tags": ["leninkart", "http"],
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count[5m])) by (job)", "legendFormat": "{{job}}", "refId": "A"}],
          "datasource": "Prometheus"
        },
        {
          "id": 2,
          "title": "HTTP 95th Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 3,
          "title": "HTTP Status Codes (5m rate)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[5m])) by (job,status)",
              "legendFormat": "{{job}} status {{status}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        }
      ]
    }

  kafka-overview.json: |
    {
      "uid": "leninkart-kafka-overview",
      "title": "LeninKart Kafka Overview",
      "tags": ["leninkart", "kafka"],
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Consumer Throughput (records/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(kafka_consumer_fetch_manager_records_consumed_total[5m])) by (client_id)",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 2,
          "title": "Consumer Bytes/s",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(kafka_consumer_fetch_manager_bytes_consumed_total[5m])) by (client_id)",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 3,
          "title": "Consumer Lag Max",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "max(kafka_consumer_fetch_manager_records_lag_max) by (client_id)",
              "legendFormat": "{{client_id}}",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        },
        {
          "id": 4,
          "title": "Kafka Clients Seen",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "count(kafka_app_info_start_time_ms)",
              "refId": "A"
            }
          ],
          "datasource": "Prometheus"
        }
      ]
    }

  ai-observer-overview.json: |
    {
      "uid": "leninkart-ai-observer",
      "title": "LeninKart AI Observer",
      "tags": ["leninkart", "ai-observer", "loki"],
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Critical/Warning Events (5m)",
          "type": "timeseries",
          "datasource": "Loki",
          "gridPos": {"h": 7, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"dev\", app=\"ai-observer\"} | json | severity=~\"warning|critical\" [5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Total Observer Reports (5m)",
          "type": "timeseries",
          "datasource": "Loki",
          "gridPos": {"h": 7, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"dev\", app=\"ai-observer\"} [5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Recommendations Stream",
          "type": "logs",
          "datasource": "Loki",
          "gridPos": {"h": 11, "w": 24, "x": 0, "y": 7},
          "targets": [
            {
              "expr": "{namespace=\"dev\", app=\"ai-observer\"} |= \"[AI-OBSERVER][recommendation]\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Component Summary (Live API)",
          "type": "logs",
          "datasource": "Loki",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 18},
          "targets": [
            {
              "expr": "{namespace=\"dev\", app=\"ai-observer\"} |= \"ai_observer_summary\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
