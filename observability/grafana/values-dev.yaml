              description: "Order-service request rate stayed below 0.05 req/s for 10m."
            labels:
              severity: warning
              service: order-service
            isPaused: false
          - uid: kafka-platform-unhealthy
            title: "Kafka Platform Unhealthy"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: "up{job=\"kafka-platform\"}"
                  instant: false
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1.0
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
            noDataState: Alerting
            execErrState: Error
            for: 3m
            annotations:
              summary: "Kafka exporter is unhealthy"
              description: "The kafka-platform metrics target stayed below 1 for 3m."
            labels:
              severity: critical
              service: kafka-platform
            isPaused: false

