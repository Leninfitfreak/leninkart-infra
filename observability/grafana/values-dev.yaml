fullnameOverride: grafana

testFramework:
  enabled: false

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

env:
  GF_AUTH_DISABLE_LOGIN_FORM: "false"
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_SERVER_DOMAIN: "127.0.0.1"
  GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.dev.svc.cluster.local
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.dev.svc.cluster.local:3100

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: leninkart
        orgId: 1
        folder: LeninKart
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/leninkart

dashboards:
  leninkart:
    leninkart-platform-overview:
      json: |
        {
          "id": null,
          "uid": "leninkart-platform-overview",
          "title": "LeninKart Platform Overview",
          "tags": [
            "leninkart",
            "platform",
            "overview"
          ],
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "graphTooltip": 0,
          "time": {
            "from": "now-15m",
            "to": "now"
          },
          "timezone": "browser",
          "panels": [
            {
              "id": 1,
              "title": "Product Request Rate",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "type": "timeseries",
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(http_server_requests_seconds_count{job=\"product-service\",uri!~\".*actuator.*\"}[5m]))",
                  "legendFormat": "product-service"
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                }
              }
            },
            {
              "id": 2,
              "title": "Order Request Rate",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "type": "timeseries",
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(http_server_requests_seconds_count{job=\"order-service\",uri!~\".*actuator.*\"}[5m]))",
                  "legendFormat": "order-service"
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                }
              }
            },
            {
              "id": 3,
              "title": "Application Error Rate",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "unit": "reqps"
                },
                "overrides": []
              },
              "type": "timeseries",
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum(rate(http_server_requests_seconds_count{job=~\"product-service|order-service\",status=~\"5..\",uri!~\".*actuator.*\"}[5m]))",
                  "legendFormat": "5xx rate"
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                }
              }
            },
            {
              "id": 4,
              "title": "Application Error Logs",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 8
              },
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "unit": "short"
                },
                "overrides": []
              },
              "type": "stat",
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "loki",
                    "uid": "loki"
                  },
                  "expr": "sum(count_over_time({namespace=\"dev\", app=~\"frontend|product-service|order-service\"} |= \"error\" [5m]))"
                }
              ],
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "orientation": "auto",
                "colorMode": "value",
                "graphMode": "none",
                "justifyMode": "auto"
              }
            }
          ],
          "templating": {
            "list": []
          },
          "annotations": {
            "list": []
          },
          "refresh": "30s"
        }
