apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: dev
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
      hostmetrics:
        collection_interval: 10s
        scrapers:
          cpu:
          memory:
          disk:
          filesystem:
          network:
      kubeletstats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
      k8sobjects:
        objects:
          - name: events
            mode: watch

    processors:
      batch:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
      resource:
        attributes:
          - key: k8s.cluster.name
            value: ${env:CLUSTER_NAME}
            action: upsert
          - key: deployment.environment
            value: ${env:ENVIRONMENT}
            action: upsert
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
          - key: host.name
            from_attribute: k8s.node.name
            action: upsert
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["service.name"], resource.attributes["service.name"])
              - set(attributes["k8s.namespace.name"], resource.attributes["k8s.namespace.name"])
              - set(attributes["k8s.deployment.name"], resource.attributes["k8s.deployment.name"])
              - set(attributes["k8s.cluster.name"], resource.attributes["k8s.cluster.name"])
              - set(attributes["host.name"], resource.attributes["host.name"])
              - set(attributes["k8s.namespace.name"], body["object"]["involvedObject"]["namespace"]) where attributes["k8s.namespace.name"] == nil
              - set(attributes["k8s.deployment.name"], body["object"]["involvedObject"]["name"]) where attributes["k8s.deployment.name"] == nil
              - set(attributes["service.name"], body["object"]["involvedObject"]["name"]) where attributes["service.name"] == nil
              - set(attributes["service.name"], "k8s-events") where attributes["service.name"] == nil

    exporters:
      otlp:
        endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
        tls:
          insecure: true
      logging:
        verbosity: detailed

    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, kubeletstats, otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
        logs:
          receivers: [k8sobjects, otlp]
          processors: [k8sattributes, memory_limiter, resource, transform/logs, batch]
          exporters: [otlp]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-env
  namespace: dev
  labels:
    app: otel-collector
data:
  CLUSTER_NAME: minikube
  ENVIRONMENT: dev
  OTEL_EXPORTER_ENDPOINT: "192.168.49.10:4317"
