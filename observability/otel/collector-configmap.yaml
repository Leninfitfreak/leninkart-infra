apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: dev
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
      hostmetrics:
        collection_interval: 10s
        scrapers:
          cpu:
          memory:
          disk:
          filesystem:
          network:
      kubeletstats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
      k8sobjects:
        objects:
          - name: events
            mode: watch

    processors:
      batch:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      resource:
        attributes:
          - key: k8s.cluster.name
            value: ${env:CLUSTER_NAME}
            action: upsert
          - key: deployment.environment
            value: ${env:ENVIRONMENT}
            action: upsert

    exporters:
      otlp:
        endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
        tls:
          insecure: true
      logging:
        verbosity: detailed

    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, kubeletstats, otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
        logs:
          receivers: [k8sobjects, otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-env
  namespace: dev
  labels:
    app: otel-collector
data:
  CLUSTER_NAME: minikube
  ENVIRONMENT: dev
  OTEL_EXPORTER_ENDPOINT: "192.168.49.10:4317"
