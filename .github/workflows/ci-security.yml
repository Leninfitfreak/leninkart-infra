name: Infra Quality & Security

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

env:
  TRIVY_VERSION: 0.65.0
  TRIVY_TIMEOUT: 15m
  TRIVY_GATE_SEVERITY: CRITICAL
  TRIVY_REPORT_SEVERITY: HIGH,CRITICAL

jobs:
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm charts
        shell: bash
        run: |
          set -euo pipefail
          helm lint applications/frontend/helm
          helm lint applications/product-service/helm --values applications/product-service/helm/values-dev.yaml
          helm lint applications/order-service/helm --values applications/order-service/helm/values-dev.yaml

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Trivy config scan workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .trivy-scan
          mkdir -p .trivy-scan/argocd .trivy-scan/k8s .trivy-scan/platform .trivy-scan/rendered
          cp -R argocd/. .trivy-scan/argocd/
          cp -R k8s/. .trivy-scan/k8s/
          cp -R platform/. .trivy-scan/platform/
          helm template frontend applications/frontend/helm > .trivy-scan/rendered/frontend.yaml
          helm template product-service applications/product-service/helm \
            --values applications/product-service/helm/values-dev.yaml > .trivy-scan/rendered/product-service-dev.yaml
          helm template order-service applications/order-service/helm \
            --values applications/order-service/helm/values-dev.yaml > .trivy-scan/rendered/order-service-dev.yaml

      - name: Run Trivy config scan report
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy:${TRIVY_VERSION} \
            config --timeout ${TRIVY_TIMEOUT} --skip-version-check \
            --severity ${TRIVY_REPORT_SEVERITY} --exit-code 0 \
            .trivy-scan

      - name: Enforce Trivy config gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy:${TRIVY_VERSION} \
            config --timeout ${TRIVY_TIMEOUT} --skip-version-check \
            --severity ${TRIVY_GATE_SEVERITY} --exit-code 1 \
            .trivy-scan
