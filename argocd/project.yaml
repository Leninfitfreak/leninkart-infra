apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: leninkart
  namespace: argocd
spec:
  description: LeninKart GitOps Project
  # Allow your infra repo + Bitnami charts + wildcard for flexibility in dev
  sourceRepos:
    - https://github.com/Leninfitfreak/leninkart-infra.git
    - https://charts.bitnami.com/bitnami
    - '*'                                   # Allows any Helm repo (safe & convenient for dev)
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
