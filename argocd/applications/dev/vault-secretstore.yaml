apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secretstore
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Deploy after Vault and ESO
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Leninfitfreak/leninkart-infra.git
    targetRevision: dev
    path: platform/external-secrets
    directory:
      recurse: true
      exclude: "applications/*"  # Don't include app secrets yet
  
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

