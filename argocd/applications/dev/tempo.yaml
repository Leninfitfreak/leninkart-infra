apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/observability/tempo/values-dev.yaml
    - repoURL: https://github.com/Leninfitfreak/leninkart-infra.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
