apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-product-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Leninfitfreak/leninkart-infra.git
    targetRevision: dev
    path: applications/product-service/helm
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

