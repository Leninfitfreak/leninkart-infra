apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-mysql
  namespace: argocd
spec:
  project: leninkart
  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts  # OCI format - new Bitnami standard
    chart: mysql
    targetRevision: 9.10.8  # Or latest stable
    helm:
      values: |
        architecture: standalone
        auth:
          rootPassword: root123
          database: leninkart
          createDatabase: true
        primary:
          nameOverride: mysql
          persistence:
            enabled: true
            size: 8Gi
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
        secondary:
          replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
