apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgresql
  namespace: argocd
spec:
  project: leninkart
  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts  # New OCI format for Bitnami 2026
    chart: postgresql
    targetRevision: 15.5.0  # Latest stable as of 2026
    helm:
      values: |
        architecture: standalone
        auth:
          postgresPassword: root123  # Change in prod!
          database: leninkart
        primary:
          nameOverride: postgres
          persistence:
            enabled: true
            size: 8Gi
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
