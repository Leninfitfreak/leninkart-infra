apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Leninfitfreak/leninkart-infra.git
    targetRevision: main
    path: platform/ingress/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

