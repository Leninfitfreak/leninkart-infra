# =========================================================
# Bitnami PostgreSQL - DEV values
# Compatible with chart: postgresql 15.5.0
# Safe for Minikube / low-resource clusters
# =========================================================

# -------------------------
# Architecture
# -------------------------
architecture: standalone

# -------------------------
# Image (PINNED – CRITICAL)
# -------------------------
image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: 15.5.0-debian-12-r0
  pullPolicy: IfNotPresent

# -------------------------
# Authentication
# -------------------------
auth:
  enablePostgresUser: true
  postgresPassword: postgres
  username: lenin
  password: lenin123
  database: leninkart

# -------------------------
# Primary (StatefulSet)
# -------------------------
primary:
  name: primary

  persistence:
    enabled: true
    size: 8Gi
    storageClass: standard

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  podSecurityContext:
    enabled: true
    fsGroup: 1001

  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    runAsNonRoot: true

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10

# -------------------------
# Service
# -------------------------
service:
  type: ClusterIP
  ports:
    postgresql: 5432

# -------------------------
# Network / TLS (DEV)
# -------------------------
tls:
  enabled: false

# -------------------------
# Metrics (disabled for DEV)
# -------------------------
metrics:
  enabled: false

# -------------------------
# Volume permissions (Minikube safe)
# -------------------------
volumePermissions:
  enabled: true
