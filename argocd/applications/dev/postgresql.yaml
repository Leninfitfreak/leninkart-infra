apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgresql
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Leninfitfreak/leninkart-infra.git
    targetRevision: dev
    path: argocd/manifests/postgresql  # Create this folder with the StatefulSet
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
