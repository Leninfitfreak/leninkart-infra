apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgresql
  namespace: argocd
spec:
  project: leninkart

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.0
    helm:
      releaseName: postgres
      values: |
        architecture: standalone

        auth:
          enablePostgresUser: true
          postgresPassword: postgres
          username: postgres
          password: postgres
          database: leninkart

        # --- IMPORTANT FIX: override images to bitnamilegacy ---
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          # Keep chart default tag unless you want to pin explicitly:
          # tag: 16.3.0-debian-12-r10

        volumePermissions:
          enabled: true
          image:
            registry: docker.io
            repository: bitnamilegacy/os-shell
            # This is what your chart tried and failed with on docker.io/bitnami
            tag: 12-debian-12-r21

        primary:
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

        diagnosticMode:
          enabled: false

        metrics:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
