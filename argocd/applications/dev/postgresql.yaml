apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgresql
  namespace: argocd
spec:
  project: leninkart

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.0
    helm:
      releaseName: postgres
      values: |
        architecture: standalone

        # 🔥 GLOBAL override (this is what was missing)
        global:
          imageRegistry: docker.io
          imagePullSecrets: []
          storageClass: standard

        image:
          registry: docker.io
          repository: bitnami/postgresql
          tag: 16.3.0
          pullPolicy: IfNotPresent

        osShell:
          image:
            registry: docker.io
            repository: bitnami/os-shell
            tag: latest

        auth:
          enablePostgresUser: true
          postgresPassword: postgres
          username: postgres
          password: postgres
          database: leninkart

        primary:
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

        volumePermissions:
          enabled: true

        diagnosticMode:
          enabled: false

        metrics:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
