apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgresql
  namespace: argocd
spec:
  project: leninkart

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.0
    helm:
      releaseName: postgres
      values: |
        architecture: standalone

        auth:
          enablePostgresUser: true
          postgresPassword: postgres
          username: lenin
          password: lenin123
          database: leninkart

        primary:
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

        service:
          ports:
            postgresql: 5432

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
