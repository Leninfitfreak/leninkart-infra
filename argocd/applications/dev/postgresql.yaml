apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-postgresql
  namespace: argocd
spec:
  project: leninkart

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 15.5.0
    helm:
      releaseName: postgres
      values: |
        image:
          repository: bitnami/postgresql
          tag: latest

        architecture: standalone

        auth:
          username: postgres
          password: postgres
          database: leninkart

        primary:
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard-rwo

          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 20m
              memory: 256Mi

        service:
          ports:
            postgresql: 5432

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
