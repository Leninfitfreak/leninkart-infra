apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-kafka
  namespace: argocd
spec:
  project: leninkart
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: kafka
    targetRevision: 26.9.0
    helm:
      values: |
        kraft:
          enabled: false

        controller:
          replicaCount: 0

        broker:
          replicaCount: 1

        zookeeper:
          enabled: true
          replicaCount: 1
          persistence:
            enabled: false

        persistence:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true