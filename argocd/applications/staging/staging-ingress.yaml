apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Leninfitfreak/leninkart-infra.git
    targetRevision: main
    path: platform/ingress/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
