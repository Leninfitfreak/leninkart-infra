replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/leninkart-478305/leninkart/order-service
  tag: dev-29-  # Known good existing tag (fixes ImagePullBackOff)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

startupProbe:
  httpGet:
    path: /actuator/health  # Actuator health endpoint (requires actuator dependency)
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 10

env:
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://dev-postgresql.dev.svc.cluster.local:5432/leninkart
  - name: SPRING_DATASOURCE_USERNAME
    value: postgres
  - name: SPRING_DATASOURCE_PASSWORD
    value: root123
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: org.postgresql.Driver

  - name: DB_NAME
    value: leninkart

  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: update

  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: kafka.dev.svc.cluster.local:9092