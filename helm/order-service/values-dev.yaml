replicaCount: 1

image:
  repository: asia-south1-docker.pkg.dev/leninkart-478305/leninkart/order-service
  tag: dev-28-  # Updated by CI workflow — will be replaced with actual tag
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

startupProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 120  # <-- Very high — app has plenty of time
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 120  # <-- High
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 180  # <-- Even higher after ready
  periodSeconds: 30
  failureThreshold: 6

env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgres.dev.svc.cluster.local:5432/leninkart"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "root123"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SERVER_PORT
    value: "8080"
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "dev-kafka.dev.svc.cluster.local:9092"  # Correct Kafka service name
  - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
    value: "false"  # <-- DEV ONLY: Prevents crash if Kafka is slow/not ready