apiVersion: v1
kind: Service
metadata:
  name: leninkart-order-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: dev-order-service
  ports:
    - name: http              # ✅ REQUIRED
      port: {{ .Values.service.port }}
      targetPort: http        # maps to containerPort name