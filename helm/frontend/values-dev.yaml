replicaCount: 1
image:
  repository: leninfitfreak/frontend
  tag: '21330320579'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80 # ✅ nginx service port
container:
  port: 80 # ✅ nginx container port
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
readinessProbe:
  httpGet:
    path: /
    port: 80 # ✅ probe nginx, not react
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 5
livenessProbe:
  httpGet:
    path: /
    port: 80 # ✅ probe nginx
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 5
