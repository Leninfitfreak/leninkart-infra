replicaCount: 1
image:
  repository: leninfitfreak/frontend
  tag: '21110957001'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
container:
  port: 3000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 5
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 10
